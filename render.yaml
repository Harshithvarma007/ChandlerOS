services:
  - type: web
    name: chandleros
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PROJECT_NAME
        sync: false
      - key: GEMINI_PROJECT_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://harshithvarma.in,https://www.harshithvarma.in
